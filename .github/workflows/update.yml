name: Update Wortschatz

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download latest vocabulary
        run: |
          curl -L \
            'https://docs.google.com/spreadsheets/d/e/2PACX-1vT84PN4G9QDWui5c-ikANjUW1e6xyDr-6ZY2Z6my7oy_i1cmXYosJb1_BPFUnif9OhkHVb-z9V8JUiD/pub?gid=0&single=true&output=csv' \
            -o wortschatz.csv

      - name: Commit updated vocabulary
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git add wortschatz.csv

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Wortschatz"
            git push
          fi
